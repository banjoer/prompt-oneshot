# balamba backend tmux server config.
# TWIST DEVIATION (see README.md): this config is BACKEND ONLY. It intentionally
# contains NO chrome: no tree/git panes, no status-bar chrome, no mouse
# bindings, no UI key tables. The original spec's `mouse on`, first-click
# focus+click, prefix+[ selection, and C-a N/P/T/e/d/r app bindings are all
# implemented as Textual widgets/screens/events in app/main.py (Textual owns
# the mouse). tmux mouse support is OFF so escape sequences reach Textual.
# Sign-off: produced 2026-11-25 by Muse Spark 1.3 Contributor (opencode-go).

# Server / session basics
set-option -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix
set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g history-limit 5000
set-option -g status off
set-option -g mouse off
set-option -g monitor-activity on
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g bell-action none
set-option -g set-titles on
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Detach only; every other binding lives in the Textual UI.
bind-key d detach-client
