<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safestep Minesweeper</title>
<style>
  :root { --cell: 30px; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#1e2430; color:#e8ecf3; margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  h1 { margin:18px 0 4px; font-size:1.6rem; letter-spacing:.5px; }
  .sub { color:#9aa6bd; font-size:.85rem; margin-bottom:12px; }
  .panel { background:#2a3345; border:1px solid #3c4861; border-radius:12px; padding:12px 16px; display:flex; flex-direction:column; gap:10px; align-items:center; width:min(96vw,860px); }
  .diff-row { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .diff-btn { border:1px solid #4a5878; background:#35405a; color:#e8ecf3; border-radius:8px; padding:8px 12px; cursor:pointer; font-size:.9rem; }
  .diff-btn.active { background:#4f7cff; border-color:#4f7cff; font-weight:700; }
  .diff-btn small { display:block; color:#c4cde0; font-size:.72rem; font-weight:400; }
  .best-tag { font-size:.72rem; color:#ffd76a; margin-left:4px; }
  .hud { display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .counter-box { background:#0d1117; border:2px inset #555; border-radius:6px; min-width:64px; text-align:center; font-family:ui-monospace,Consolas,monospace; font-size:1.4rem; color:#ff3b30; padding:2px 10px; }
  #faceBtn { font-size:1.8rem; width:52px; height:52px; border-radius:10px; border:2px outset #888; background:#bdbdbd; cursor:pointer; line-height:1; }
  #faceBtn:active { border-style:inset; }
  #message { min-height:1.4em; font-weight:700; color:#7CFF9B; }
  #message.lost { color:#ff6b6b; }
  #newBest { display:none; color:#ffd76a; font-weight:800; }
  #boardWrap { max-width:96vw; overflow:auto; background:#808080; padding:6px; border-radius:8px; border:3px outset #aaa; }
  #board { display:grid; gap:0; user-select:none; -webkit-user-select:none; }
  .cell { width:var(--cell); height:var(--cell); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:1.05rem; border:2px outset #fff; background:#bdbdbd; cursor:pointer; line-height:1; padding:0; }
  .cell.covered:active { border-style:inset; }
  .cell.revealed { border:1px solid #7d7d7d; background:#c9c9c9; cursor:default; }
  .cell.flagged { cursor:pointer; }
  .cell.mine-hit { background:#ff0000 !important; border:1px solid #7d7d7d; }
  .cell.wrong-flag { background:#c9c9c9; border:1px solid #7d7d7d; }
  .n1{color:#0000ff}.n2{color:#008000}.n3{color:#ff0000}.n4{color:#000080}
  .n5{color:#800000}.n6{color:#008080}.n7{color:#000000}.n8{color:#808080}
  .help { font-size:.78rem; color:#9aa6bd; text-align:center; max-width:640px; }
  footer { margin:16px 0 24px; color:#8b96ad; font-size:.82rem; }
  @media (max-width:700px){ :root{--cell:24px;} .cell{font-size:.9rem;} }
</style>
</head>
<body>
<h1>💣 Safestep Minesweeper</h1>
<div class="sub">First click is always safe — and always opens a region.</div>
<div class="panel">
  <div class="diff-row" id="diffRow">
    <button class="diff-btn" data-diff="beginner">Beginner<small>9×9 · 10 💣 <span class="best-tag" id="best-beginner"></span></small></button>
    <button class="diff-btn" data-diff="intermediate">Intermediate<small>16×16 · 40 💣 <span class="best-tag" id="best-intermediate"></span></small></button>
    <button class="diff-btn" data-diff="expert">Expert<small>30×16 · 99 💣 <span class="best-tag" id="best-expert"></span></small></button>
  </div>
  <div class="hud">
    <div title="Mines remaining">🚩 <span class="counter-box" id="mineCounter">10</span></div>
    <button id="faceBtn" title="Reset">🙂</button>
    <div title="Timer">⏱ <span class="counter-box" id="timer">0</span></div>
  </div>
  <div id="message"></div>
  <div id="newBest">★ New best! ★</div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="help">Left-click: reveal · Right-click: flag 🚩 · Click an open number with enough flags to <b>chord</b> · Win by revealing all safe cells.</div>
</div>
<footer>Built 2026-10-30 09:00 UTC · Muse Spark 1.3 Contributor</footer>
<script>
(function(){
"use strict";
var DIFFS = {
  beginner: { rows:9, cols:9, mines:10 },
  intermediate: { rows:16, cols:16, mines:40 },
  expert: { rows:16, cols:30, mines:99 }
};
var cur = 'beginner';
var rows=9, cols=9, totalMines=10;
var grid=[]; // [r][c] = {mine,revealed,flagged,adj}
var minesPlaced=false, gameStatus='ready'; // ready|playing|won|lost
var flagsPlaced=0, revealedCount=0, seconds=0, timerId=null;
var hitR=-1, hitC=-1;

var boardEl=document.getElementById('board'),
    counterEl=document.getElementById('mineCounter'),
    timerEl=document.getElementById('timer'),
    faceBtn=document.getElementById('faceBtn'),
    msgEl=document.getElementById('message'),
    newBestEl=document.getElementById('newBest');

function loadBest(){ try{ var v=JSON.parse(localStorage.getItem('safestepBest')||'{}'); return (v&&typeof v==='object')?v:{}; }catch(e){ return {}; } }
function saveBest(o){ localStorage.setItem('safestepBest', JSON.stringify(o)); }
function refreshBestLabels(){
  var b=loadBest();
  ['beginner','intermediate','expert'].forEach(function(k){
    var el=document.getElementById('best-'+k);
    el.textContent = (b[k]!=null) ? ('· ⏱'+b[k]+'s') : '';
  });
}
function markActiveDiff(){
  document.querySelectorAll('.diff-btn').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('data-diff')===cur);
  });
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startTimer(){
  stopTimer();
  timerId=setInterval(function(){
    if(gameStatus!=='playing') return;
    seconds++;
    timerEl.textContent = Math.min(seconds,999);
  },1000);
}
function updateHUD(){
  counterEl.textContent = (totalMines - flagsPlaced);
  if(!timerId && gameStatus!=='playing'){ timerEl.textContent = Math.min(seconds,999); }
  faceBtn.textContent = gameStatus==='lost' ? '😵' : (gameStatus==='won' ? '😎' : '🙂');
}
function newGame(diffKey){
  cur=diffKey;
  var d=DIFFS[cur]; rows=d.rows; cols=d.cols; totalMines=d.mines;
  grid=[]; for(var r=0;r<rows;r++){ var row=[]; for(var c=0;c<cols;c++) row.push({mine:false,revealed:false,flagged:false,adj:0}); grid.push(row); }
  minesPlaced=false; gameStatus='ready'; flagsPlaced=0; revealedCount=0; seconds=0; hitR=hitC=-1;
  stopTimer();
  msgEl.textContent=''; msgEl.className='';
  newBestEl.style.display='none';
  timerEl.textContent='0';
  // cell size: shrink for expert so it fits
  var size = (cur==='expert') ? 26 : 30;
  if(window.innerWidth<700) size = (cur==='expert') ? 22 : 24;
  document.documentElement.style.setProperty('--cell', size+'px');
  markActiveDiff(); refreshBestLabels(); buildDOM(); updateHUD();
}
function buildDOM(){
  boardEl.style.gridTemplateColumns='repeat('+cols+', var(--cell))';
  boardEl.style.gridTemplateRows='repeat('+rows+', var(--cell))';
  boardEl.innerHTML='';
  var frag=document.createDocumentFragment();
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
    (function(rr,cc){
      var b=document.createElement('button');
      b.className='cell covered'; b.type='button';
      b.dataset.r=rr; b.dataset.c=cc;
      b.setAttribute('aria-label','covered');
      b.addEventListener('click', function(e){ onLeft(rr,cc); });
      b.addEventListener('contextmenu', function(e){ e.preventDefault(); onRight(rr,cc); });
      frag.appendChild(b);
    })(r,c);
  }
  boardEl.appendChild(frag);
  boardEl.oncontextmenu=function(e){ e.preventDefault(); return false; };
}
function cellEl(r,c){ return boardEl.children[r*cols+c]; }
function inB(r,c){ return r>=0&&r<rows&&c>=0&&c<cols; }
function neighbours(r,c){
  var out=[];
  for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){
    if(!dr&&!dc) continue;
    var nr=r+dr,nc=c+dc; if(inB(nr,nc)) out.push([nr,nc]);
  }
  return out;
}
function placeMines(safeR,safeC){
  var safe={};
  for(var dr=-1;dr<=1;dr++) for(var dc=-1;dc<=1;dc++){
    var nr=safeR+dr,nc=safeC+dc; if(inB(nr,nc)) safe[nr+','+nc]=true;
  }
  var candidates=[];
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) if(!safe[r+','+c]) candidates.push([r,c]);
  // Fisher-Yates shuffle
  for(var i=candidates.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=candidates[i]; candidates[i]=candidates[j]; candidates[j]=t; }
  for(var k=0;k<totalMines;k++){ var cell=candidates[k]; grid[cell[0]][cell[1]].mine=true; }
  for(var rr=0;rr<rows;rr++) for(var cc=0;cc<cols;cc++){
    if(grid[rr][cc].mine) continue;
    var n=0; neighbours(rr,cc).forEach(function(nb){ if(grid[nb[0]][nb[1]].mine) n++; });
    grid[rr][cc].adj=n;
  }
  minesPlaced=true;
}
function paintCell(r,c){
  var el=cellEl(r,c), s=grid[r][c];
  el.className='cell'; el.textContent='';
  if(s.revealed){
    if(s.mine){ el.classList.add('revealed'); el.textContent='💣'; }
    else{
      el.classList.add('revealed');
      if(s.adj>0){ el.textContent=String(s.adj); el.classList.add('n'+s.adj); }
    }
  } else if(s.flagged){ el.classList.add('covered','flagged'); el.textContent='🚩'; }
  else { el.classList.add('covered'); }
}
function paintAll(){ for(var r=0;r<rows;r++) for(var c=0;c<cols;c++) paintCell(r,c); }
function revealFlood(sr,sc){
  // BFS flood: reveal connected 0-region + border numbers
  var q=[[sr,sc]];
  var seen={}; seen[sr+','+sc]=true;
  while(q.length){
    var curc=q.shift(), r=curc[0], c=curc[1];
    var s=grid[r][c];
    if(s.revealed||s.flagged) continue;
    s.revealed=true; revealedCount++;
    if(s.adj===0 && !s.mine){
      neighbours(r,c).forEach(function(nb){
        var k=nb[0]+','+nb[1];
        if(!seen[k]){ seen[k]=true; var ns=grid[nb[0]][nb[1]]; if(!ns.revealed&&!ns.flagged) q.push(nb); }
      });
    }
  }
}
function onLeft(r,c){
  if(gameStatus==='won'||gameStatus==='lost') return;
  var s=grid[r][c];
  if(s.flagged) return;
  if(s.revealed){ chord(r,c); return; }
  // covered cell reveal
  if(!minesPlaced){
    placeMines(r,c);
    gameStatus='playing'; seconds=0; timerEl.textContent='0'; startTimer();
  }
  if(s.mine){ lose(r,c); return; }
  revealFlood(r,c);
  paintAll(); updateHUD(); checkWin();
}
function onRight(r,c){
  if(gameStatus==='won'||gameStatus==='lost') return;
  var s=grid[r][c];
  if(s.revealed) return;
  s.flagged=!s.flagged;
  flagsPlaced += s.flagged?1:-1;
  paintCell(r,c); updateHUD();
}
function chord(r,c){
  var s=grid[r][c];
  if(!s.revealed||s.mine||s.adj===0) return;
  var nbs=neighbours(r,c), flagCount=0;
  nbs.forEach(function(nb){ if(grid[nb[0]][nb[1]].flagged) flagCount++; });
  if(flagCount!==s.adj) return;
  // open all covered unflagged neighbours
  var toOpen=nbs.filter(function(nb){ var q=grid[nb[0]][nb[1]]; return !q.revealed&&!q.flagged; });
  var hitMine=null;
  for(var i=0;i<toOpen.length;i++){
    var q=grid[toOpen[i][0]][toOpen[i][1]];
    if(q.mine){ hitMine=toOpen[i]; break; }
  }
  if(hitMine){
    // detonate: reveal hit cell (and any other touched mines among toOpen)
    lose(hitMine[0],hitMine[1]);
    return;
  }
  toOpen.forEach(function(nb){ revealFlood(nb[0],nb[1]); });
  paintAll(); updateHUD(); checkWin();
}
function lose(hr,hc){
  gameStatus='lost'; hitR=hr; hitC=hc; stopTimer();
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
    var s=grid[r][c], el=cellEl(r,c);
    el.className='cell'; el.textContent='';
    if(r===hr&&c===hc){ el.classList.add('mine-hit'); el.textContent='💥'; }
    else if(s.mine){ if(s.flagged){ el.classList.add('covered','flagged'); el.textContent='🚩'; } else { el.classList.add('revealed'); el.textContent='💣'; } }
    else { if(s.flagged){ el.classList.add('wrong-flag'); el.textContent='❌'; } else if(s.revealed){ el.classList.add('revealed'); if(s.adj>0){ el.textContent=String(s.adj); el.classList.add('n'+s.adj);} } else { el.classList.add('covered'); } }
  }
  msgEl.textContent='💥 Boom! You hit a mine.';
  msgEl.className='lost';
  updateHUD();
}
function checkWin(){
  if(gameStatus!=='playing'||!minesPlaced) return;
  if(revealedCount===(rows*cols-totalMines)){
    gameStatus='won'; stopTimer();
    // auto-flag all mines
    flagsPlaced=0;
    for(var r=0;r<rows;r++) for(var c=0;c<cols;c++){
      var s=grid[r][c];
      if(s.mine){ s.flagged=true; flagsPlaced++; }
    }
    paintAll(); updateHUD();
    msgEl.textContent='🏆 You win!';
    msgEl.className='';
    // best time
    var b=loadBest(), prev=b[cur];
    if(prev==null||seconds<prev){
      b[cur]=seconds; saveBest(b); refreshBestLabels();
      newBestEl.style.display='block';
    }
  }
}
document.querySelectorAll('.diff-btn').forEach(function(btn){
  btn.addEventListener('click', function(){ newGame(btn.getAttribute('data-diff')); });
});
faceBtn.addEventListener('click', function(){ newGame(cur); });
newGame('beginner');
})();
</script>
</body>
</html>
