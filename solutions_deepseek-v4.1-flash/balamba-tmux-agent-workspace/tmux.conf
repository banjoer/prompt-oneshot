# balamba tmux server — CONTENT ONLY (Textual reinterpretation)
#
# The Textual app owns the tree, tabs, git panel, status bar, dialogs, keys and
# mouse.  This server only hosts terminal processes: one window per tab, panes
# for splits.  There is intentionally no tmux status bar, no tmux mouse, and no
# workspace key table here.
set -g status off
set -g mouse off
set -g prefix C-a
unbind C-b
set -g history-limit 5000
set -g escape-time 20
set -g focus-events off
set -g monitor-activity on
set -g default-terminal "screen-256color"
set -g set-titles off
set -g visual-activity off
set -g visual-bell off
set -g bell-action none
set -g allow-rename off
set -g automatic-rename off
set -g pane-border-style "fg=#30363d"
set -g pane-active-border-style "fg=#58a6ff"
# No bindings: every gesture is a Textual event.
