/* ================= Rigsmith core =================
   Deterministic parametric SVG character factory.

   every random value derives from the seeded mulberry32 PRNG or from wall-clock
   entropy for new seeds. */

function fmt(v){ // stable 2-decimal number string ("-0" guarded)
  if(!isFinite(v)) v=0;
  let s=(Math.round(v*100)/100).toString();
  if(s==="0"&&Object.is(Math.round(v*100)/100,-0)) s="0";
  if(s.indexOf("e")>=0||s.indexOf("E")>=0) s=(Math.round(v*100)/100).toFixed(2);
  return s==="NaN"?"0":s;
}
function mulberry32(a){a=a>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a^Math.trunc(a>>>15);t=Math.imul(t,1|t);t=(t+Math.trunc(t>>>7))>>>0;return ((t^Math.trunc(t>>>13))>>>0)/4294967296;};}

/* piecewise keyframe sampler: keys=[[t,v],...] */
function kf(t,keys){
  if(t<=keys[0][0])return keys[0][1];
  const n=keys.length;
  if(t>=keys[n-1][0])return keys[n-1][1];
  for(let i=1;i<n;i++){
    if(t<=keys[i][0]){

      return lerp(keys[i-1][1],keys[i][1],f);

function normSpec(raw){
  const s={};
  for(const k in DEF){
    let v=raw&&raw[k];
    if(k==="seed"){
      v=Number(v); if(!isFinite(v))v=DEF[k];
      s[k]=Math.min(2147483646,Math.max(0,Math.floor(v)));
    }else if(k in RANGES){
      v=Number(v); if(!isFinite(v))v=DEF[k];
      v=clamp(v,RANGES[k][0],RANGES[k][1]);
      s[k]=Math.round(v*100)/100;
    }else{
      const ok=DEF[k];
      s[k]=(typeof v==="string")?v:ok;
      if(ENUMS.some(e=>e.k===k)&&!eOf(k).opts.includes(s[k])) s[k]=ok;
    }
  }
  return s;
}
const eOf=k=>ENUMS.find(e=>e.k===k);

/* pose helper object */
function act(){return{dx:0,dy:0,sq:1,lean:0,spineA:0,neckA:0,headA:0,headRoll:0,
  hipDX:0,hipDY:0,hipRot:0,chestSX:1,chestSY:1,
  armFK:[[0,8],[0,-8]],legFK:[[0,6,0],[0,-6,0]],feet:null,gait:null,
  armMode:"fk",legMode:"ik",tail:0,ears:0,wall:false,toePoint:0};}

/* gait engine: returns foot targets for both legs given normalized phase.
   stride/lift in px; contact keeps stance y exactly at ground (planting). */
function gait(p,par){
  const stance=par.stance??0.6, stride=par.stride??34, lift=par.lift??16;
  const mk=ph=>{
    let q=((ph%1)+1)%1;
    const inStance=q<stance;
    let x,y,rot;
    if(inStance){
      const s=q/stance; // 0..1 across stance
      x=stride/2-stride*s;                               // planted: glides back as the body moves on
      const fl=par.flat??0;                              // flat stance (crawl/tiptoe): constant angle
      rot=par.plantRot!==undefined?(par.plantRot[0]+(par.plantRot[1]-par.plantRot[0])*easeIO(clamp((s-.55)/.45,0,1))):(-14+38*easeIO(clamp((s-.5)/.5,0,1)));
      y=0;                                               // 0 = ankle rest height → foot bottom on G
    }else{
      const s=(q-stance)/(1-stance);
      x=-stride/2+stride*easeIO(s);                      // forward swing: back→front
      y=-lift*Math.sin(Math.PI*s)*(par.arc??.9)-0.0;
      rot=(par.swingRot!==undefined)?par.swingRot:-16+10*s;
    }
    return{x,y,rot,inStance,q};
  };
  return{A:mk(p+(par.offA??0)),B:mk(p+(par.offB??.5))};
}

/* ---------- springs (deterministic follow-through) ---------- */
/* integrate a spring-damper over the clip time axis with fixed steps.
   target(s) must be pure. loop=true seeds history from one lap before t. */
function springVal(target,t,dur,loop,w,zeta){
  const steps=loop?22:18, h=Math.min(dur/steps,0.05);
  let x=target(Math.max(loop?t-steps*h:0,t)),v=0;
  const n=loop?steps:Math.ceil(t/h)+1, dt=loop?h:Math.min(h,t/Math.max(n-1,1)||h);
  const t0=loop?t-n*dt:0;
  for(let i=0;i<n;i++){
    const s=loop?(((t0+i*dt)%dur)+dur)%dur:Math.min(dur,t0+i*dt);
    const tg=target(s);
    const acc=(tg-x)*w*w - 2*zeta*w*v;
    v+=acc*dt; x+=v*dt;
  }
  return x;
}

/* ---------- rig metrics ---------- */
function makeRig(s){
  const S=s.height;
  const headR=27*s.head*Math.sqrt(S);
  const eyeR=headR/30;
  if(s.archetype==="humanoid"){
    const legU=52*s.leg*S, legL=48*s.leg*S;
    return{type:"hum",S,legU,legL,hipW:12*s.torso*S,
      hipY:G-(legU+legL)-6,
      spineLen:30*S,chestLen:32*S,neckLen:(5+21*s.neck)*S,
      headR,shX:16*s.torso*S,armU:30*s.arm*S,armF:28*s.arm*S,
      torsoW:19*s.torso*S,chestW:17*s.torso*S,bellyR:13*s.belly*S,
      legW:9.5*S+2.5,armW:7*S+2,footL:16+7*S,footH:6+2.5*S,
      earR:8*s.ear*S+3,eyeR,tailLen:26*s.tail*S,
      topRef:-( (legU+legL)+30*S+32*S+(5+21*s.neck)*S+headR*2 )};
  }
  if(s.archetype==="beast"){
    const legU=34*s.leg*S, legL=34*s.leg*S, fU=30*s.arm*S, fF=30*s.arm*S;
    return{type:"beast",S,legU,legL,fU,fF,hipW:9*s.torso*S,
      hipY:G-(legU+legL)*0.94-8,
      spineLen:40*S*(0.7+0.3*s.torso),chestLen:40*S*(0.7+0.3*s.torso),neckLen:(12+16*s.neck)*S,
      headR:24*s.head*Math.sqrt(S),
      armU:fU,armF:fF,shX:6*s.torso*S,
      torsoW:17*s.torso*S,chestW:16*s.torso*S,bellyR:11*s.belly*S,
      legW:10*S+2.5,armW:9*S+2,footL:14+5*S,footH:5+2*S,
      earR:11*s.ear*S+4,eyeR:24*s.head*Math.sqrt(S)/30,tailLen:34*s.tail*S,
      topRef:-90*S};
  }
  const bw=50*s.torso*S, bh=42*S;
  return{type:"blob",S,bw,bh,legU:9*s.leg*S,legL:9*s.leg*S,hipW:16*s.torso*S,
    hipY:G-14,
    spineLen:8*S,chestLen:8*S,neckLen:(2+8*s.neck)*S,
    headR:bw*0.55,eyeR:(22*s.head+12)*S/30,
    shX:bw*0.86,armU:13*s.arm*S,armF:11*s.arm*S,
    torsoW:bw,chestW:bw,bellyR:20*s.belly*S,
    legW:8+4*s.leg,armW:7+3*s.arm,footL:12+4*S,footH:5+2*S,
    earR:7*s.ear*S+3,tailLen:16*s.tail*S,topRef:-2*bh};
}

/* ---------- clip poses (pure functions of normalized t) ---------- */
function clipAct(id,t,s,r){
  const A=act();
  switch(id){
  case "idle":{
    A.chestSY=1+.05*osc(t,1);A.chestSX=1+.022*osc(t,1,.5);
    A.dy=-2.2*osc(t,1)+ (s.archetype==="blob"? -1.5*osc(t,1):0);
    A.headA=2.4*osc(t,1,.25);A.lean=1.2*osc(t,1,.1);
    A.armFK=[[3+2*osc(t,1,.3),9],[-3+2*osc(t,1,.35),-8]];
    A.legFK=[[2*osc(t,1,.3),5,0],[-2*osc(t,1,.3),-4,0]];
    A.tail=7*osc(t,1,.15);A.ears=2.6*osc(t,1,.4);
    if(s.archetype==="blob")A.sq=1+.045*osc(t,1,.2);
    A.gait=null;A.legMode="fk";
    return A;}
  case "walk":{
    const p=t;
    A.gait=gait(p,{stride:34*s.leg*s.height, lift:17, stance:.62, plantRot:[-12,26], swingRot:-8});
    A.legMode="ik";
    A.armFK=[[-26*Math.cos(p*2*Math.PI)-4, 22+12*Math.max(0,Math.sin(p*2*Math.PI))],
             [ 26*Math.cos(p*2*Math.PI)+4, 22+12*Math.max(0,-Math.sin(p*2*Math.PI))]];
    A.dy=-2.6*Math.abs(osc(p,2));A.lean=7;A.headA=-2.5+1.8*osc(p,2,.5);
    A.hipDX=2.2*osc(p,2,.25);
    A.chestSY=1+.015*osc(p,2);
    A.tail=9*osc(p,2,.25);A.ears=3*osc(p,2,.5);
    if(s.archetype==="blob"){A.legMode="fk";A.sq=1+.05*osc(p,2,.3);}
    return A;}
  case "run":{
    const p=t, st=.3;
    A.gait=gait(p,{stride:56*s.leg*s.height,lift:26,stance:st,plantRot:[-16,30],swingRot:-26});
    A.legMode="ik";
    A.armFK=[[-42*Math.cos(p*2*Math.PI),48],[-42*Math.cos(p*2*Math.PI+Math.PI),46]];
    A.lean=16+2*osc(p,1);
    A.dy=-(p>.4&&p<.5||p>.9?-6:0)-4*Math.abs(osc(p,2))-.0; // subtle; flight handled by both feet lifted
    A.headA=-6;A.chestSY=1+.02*osc(p,2);
    A.tail=13*osc(p,2,.1);A.ears=5*osc(p,2,.45);
    if(s.archetype==="blob"){A.legMode="fk";A.sq=1+.09*osc(p,2,.3);}
    return A;}
  case "jump":{
    const h=88*s.height;
    A.legMode="ik";
    let dy=0,crouch=0,rot=0,armSh=0,armEl=10,lean=0,tuck=0;
    if(t<.28){const u=easeOut(t/.28);dy=-34*u;crouch=34*u;armSh=-30*u;armEl=14+30*u;lean=10*u;}
    else if(t<.44){const u=clamp((t-.28)/.16,0,1);dy=lerp(-34,-h,easeIn(u));crouch=lerp(34,0,u);armSh=lerp(-30,-152,easeOut(u));armEl=lerp(44,8,easeOut(u));lean=lerp(10,-6,easeOut(u));rot=-10*u;}
    else if(t<.8){const u=(t-.44)/.36;
      dy=u<.5?lerp(-h,-h*.3,easeIn(u/.5)):lerp(-h*.3,0,easeOut((u-.5)/.5));
      tuck=26;armSh=-152+30*u;armEl=8+26*u;lean=-6;rot=-18+30*u;}
    else if(t<.88){const u=easeOut((t-.8)/.08);dy=lerp(0,-24,u);crouch=30*u;tuck=lerp(26,0,u);armSh=lerp(-122,-24,easeIO(u));armEl=lerp(34,16,u);lean=-8;rot=lerp(12,-12,u);}
    else{const u=easeIO((t-.88)/.12);dy=lerp(-24,0,u);crouch=lerp(30,2,u);armSh=lerp(-24,0,u);armEl=lerp(16,8,u);lean=lerp(-8,0,u);}
    A.dy=dy*s.height;A.lean=lean;A.legCrouch=crouch;
    A.chestSY=1+.045*(crouch/34)-.05*(t>=.28&&t<.44?Math.sin((t-.28)/.16*Math.PI):0)+(t>=.8&&t<.88?.05*easeOut((t-.8)/.08):0);
    A.armFK=[[armSh,armEl],[armSh*.92+3,armEl+4]];
    A.feet=[{x:-11*s.height,y:0,rot,tuck},{x:11*s.height,y:0,rot,tuck}];
    A.tail=t<.44?-20*(t/.44):(t<.8?22:lerp(22,0,clamp((t-.8)/.2,0,1)));
    A.ears=t>.3&&t<.8?10:0;
    if(s.archetype==="blob"){A.sq=t<.28?1+.22*easeOut(t/.28):(t<.44?lerp(1.22,.78,easeIn((t-.28)/.16)):(t<.8?.84:(t<.88?1.16:1)));}
    return A;}
  case "crawl":{
    const p=t, S=s.height;
    A.gait=gait(p,{stride:26*S,lift:9,stance:.55,plantRot:[2,8],swingRot:-14});
    A.legMode="ik";
    A.dy=52*S*(0.8+0.2*s.leg)+6*s.neck*S; // drop body toward ground
    A.lean=26;A.headA=-24;A.headRoll=3;
    A.armFK=[[-70*Math.cos(p*2*Math.PI)-15,-12],[0,6]];
    A.tail=6*osc(p,1,.2);A.ears=2*osc(p,1,.4);
    if(s.archetype==="blob"){A.sq=.66;A.legMode="fk";}
    return A;}
  case "step":{
    const p=t;
    A.gait=gait(p,{stride:22*s.leg*s.height,lift:33,stance:.55,plantRot:[26,30],swingRot:24,arc:1});
    A.legMode="ik";A.toePoint=1;
    A.armFK=[[ -16*Math.cos(p*2*Math.PI)-6, 30],[16*Math.cos(p*2*Math.PI)+6,30]];
    A.dy=-3*Math.abs(osc(p,2))-.0;A.lean=4;A.headA=-3+2*osc(p,1,.2);
    A.chestSY=1+.02*osc(p,2);A.tail=8*osc(p,2,.1);A.ears=4*osc(p,2,.3);
    if(s.archetype==="blob"){A.legMode="fk";A.sq=1+.07*osc(p,2);}
    return A;}
  case "taunt":{
    const p=t;
    A.legMode="fk";A.armMode="fk";
    A.lean=-4;A.headRoll=10*easeOut(clamp(p*3,0,1));A.headA=-5+3*osc(p,4);
    const beck=clamp((p-.1)/.55,0,1);
    const wave=Math.sin(clamp((p-.1)/.6,0,1)*Math.PI*5);
    A.armFK=[[70+6*wave,34-22*Math.max(0,wave)],[-34,42]]; // right hand beckons, left on hip
    if(p<.1)A.armFK=[[lerp(0,70,easeOut(p*10)),20],[-lerp(0,34,p*10),18]];
    if(p>.72){const q=easeIO((p-.72)/.28);A.armFK=[[lerp(70,-166,q),lerp(20,34,q)],[lerp(-34,160,q),lerp(42,16,q)]];
      A.headRoll=lerp(10,-4,q);}
    A.chestSX=1+.1*Math.max(0,Math.sin(clamp((p-.1)/.6,0,1)*Math.PI*5));
    A.chestSY=1+.04*osc(p,2);
    A.hipDX=2.5*osc(p,2);A.lean+=1.6*osc(p,2);
    A.tail=10*osc(p,3,.1);A.ears=5*osc(p,3,.4);
    if(s.archetype==="blob")A.sq=1+.03*osc(p,2);
    return A;}
  case "dance":{
    const p=t;
    A.gait=gait(p,{stride:10,lift:8,stance:.72,plantRot:[-4,14],swingRot:-10});
    A.legMode="ik";A.armMode="fk";
    A.hipDX=10*osc(p,2);A.hipRot=9*osc(p,2,.25);
    A.lean=3*osc(p,2,.6);A.spineA=4*osc(p,2);
    A.dy=-6*Math.abs(osc(p,4))-.0;
    A.armFK=[[-150*Math.max(0,osc(p,2)) -20*Math.min(0,osc(p,2))-10, 60+30*Math.max(0,osc(p,2))],
             [ 150*Math.max(0,-osc(p,2))+20*Math.min(0,-osc(p,2))+10,60+30*Math.max(0,-osc(p,2))]];
    A.headA=-4+3*osc(p,4,.5);A.headRoll=6*osc(p,2,.1);
    A.chestSY=1+.05*osc(p,4);A.chestSX=1+.05*osc(p,4,.5);
    A.tail=14*osc(p,4,.2);A.ears=6*osc(p,4,.5);
    if(s.archetype==="blob"){A.sq=1+.09*osc(p,4,.15);}
    return A;}
  case "climb":{
    const p=t;
    A.legMode="ik";A.armMode="ik";A.wall=true;A.climb=true;
    A.lean=-10;A.headA=8;A.dx=-2;A.dy=-4+3*osc(p,2);
    const rm=ph=>{const q=((p+ph)%1);return q<.5?easeIO(q/.5):1-easeIO((q-.5)/.5);};
    A.climbHands=[{x:128,y:lerp(-112,-196,rm(0))},{x:128,y:lerp(-112,-196,rm(.5))}];
    A.climbFeet=[{x:118,y:lerp(-10,-58,rm(.25))},{x:118,y:lerp(-10,-58,rm(.75))}];
    A.armFK=[[118,28],[118,28]];
    A.tail=8*osc(p,2,.3);A.ears=4*osc(p,2,.2);
    if(s.archetype==="blob"){A.legMode="fk";A.armMode="fk";A.sq=1+.06*osc(p,2);
      A.armFK=[[128+46*rm(0),18],[128+46*rm(.5),18]];}
    return A;}
  }
  // expression clips: calm body + head framing, face overlay handled in faceState
  A.legMode="fk";A.armMode="fk";
  A.chestSY=1+.02*osc(t,2);A.dy=-1.2*osc(t,2);A.headA=1.5*osc(t,1,.25);
  A.armFK=[[4,10],[-4,-8]];A.legFK=[[2,5,0],[-2,-4,0]];A.tail=5*osc(t,2,.2);A.ears=2*osc(t,2,.5);
  if(s.archetype==="blob")A.sq=1+.02*osc(t,2);
  return A;
}
function S0(s){return s.height||1;}
/* ---------- two-bone IK ---------- */
function ikPair(ax,ay,tx,ty,l1,l2,dir){
  let dx=tx-ax, dy=ty-ay; const raw=Math.hypot(dx,dy)||0.0001;
  const maxR=l1+l2-0.05, minR=Math.abs(l1-l2)+0.05;
  const d=clamp(raw,minR,maxR);
  const ex=ax+dx/raw*d, ey=ay+dy/raw*d;
  const base=Math.atan2(ey-ay,ex-ax);
  const ca=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  const a1=base+dir*ca;
  const mx=ax+Math.cos(a1)*l1, my=ay+Math.sin(a1)*l1;
  return{mid:{x:mx,y:my},end:{x:ex,y:ey},a1,a2:Math.atan2(ey-my,ex-mx)};
}
const upVec=(deg,len)=>({x:Math.sin(deg*D2R)*len,y:-Math.cos(deg*D2R)*len});  // 0°=up, + leans forward
const armVec=(deg,len)=>({x:Math.sin(deg*D2R)*len,y:Math.cos(deg*D2R)*len});  // 0°=down, + swings forward
/* lowest point of the foot below the ankle for a given pitch → sole can stay pinned to G */
function soleY(rot,fl,fh){
  const a=rot*D2R,c=0.95*fh*Math.cos(a);
  return a>=0?c+0.55*fl*Math.sin(a):c+0.3*fl*-Math.sin(a);
}

/* ---------- deterministic spring-damper over clip time ---------- */
function springVal(target,t,dur,loop,w,zeta){
  if(dur<=0)dur=0.001;
  const h=Math.min(dur/24,0.045);
  let x,v,s0,n;
  if(loop){
    n=18; s0=t-n*h; x=target(s0); v=0;
    for(let i=0;i<n;i++){
      const tg=target(s0+i*h);
      const acc=(tg-x)*w*w-2*zeta*w*v; v+=acc*h; x+=v*h;
    }
  }else{
    n=Math.max(1,Math.min(40,Math.ceil(t/h))); const dt=t/n;
    x=target(0); v=0;
    for(let i=0;i<n;i++){
      const tg=target(dt*(i+1));
      const acc=(tg-x)*w*w-2*zeta*w*v; v+=acc*dt; x+=v*dt;
    }
  }
  return x;
}
function springOffsets(s,r,clipId,t,dur,loop){
  const norm=u=>loop?((((u%dur)+dur)%dur)/dur):clamp(u/dur,0,1);
  const tailTgt=sec=>{const A=clipAct(clipId,norm(sec),s,r);return A.tail+A.lean*0.55+A.dx*0.2;};
  const earTgt =sec=>{const A=clipAct(clipId,norm(sec),s,r);return A.ears+A.dx*0.3+A.headA*0.4;};
  const tt=t*dur;
  const tailX=springVal(tailTgt,tt,dur,loop,24,0.55);
  const earX =springVal(earTgt ,tt,dur,loop,30,0.6);
  return{tail:clamp(tailX-tailTgt(tt),-24,24),ear:clamp(earX-earTgt(tt),-16,16)};
}

/* ---------- skeleton solve → world joints ---------- */
function solveJoints(s,r,A,sp){
  const J={}; const cx=W/2;
  if(r.type==="hum"){
    J.hips={x:cx+A.dx+A.hipDX,y:r.hipY+A.dy+A.hipDY};
    const a1=A.lean*0.4+A.spineA;
    J.spine={x:J.hips.x+upVec(a1,r.spineLen).x,y:J.hips.y+upVec(a1,r.spineLen).y};
    const a2=a1+A.lean*0.45;
    J.chest={x:J.spine.x+upVec(a2,r.chestLen*A.chestSY).x,y:J.spine.y+upVec(a2,r.chestLen*A.chestSY).y};
    const a3=a2+A.neckA;
    J.neck={x:J.chest.x+upVec(a3,r.neckLen).x,y:J.chest.y+upVec(a3,r.neckLen).y};
    const a4=a3+A.headA;

  add(E("ellipse",{cx:q(J.hips.x),cy:q(G+7),rx:q(r.torsoW*1.5*Math.sqrt(1/Math.max(.6,sq))),ry:q(6*r.S),fill:"#000",opacity:shOp}));
  add(E("ellipse",{cx:q(J.ankL.x),cy:q(G+4),rx:q(r.footL*0.55),ry:q(3*r.S),fill:"#000",opacity:shOp*0.8}));
  add(E("ellipse",{cx:q(J.ankR.x),cy:q(G+4),rx:q(r.footL*0.6),ry:q(3.4*r.S),fill:"#000",opacity:shOp*0.9}));
  if(o.exShadow){
    add(E("ellipse",{cx:q(J.hips.x),cy:q(G+6),rx:q(r.torsoW*1.6),ry:q(7*r.S),fill:"#000",opacity:0.22}));
  }

  /* ---- tail ---- */
  if(J.tail.length){
    const ws=[5.4*r.S,4*r.S,2.8*r.S,1.8*r.S,1.1*r.S].map(x=>x*(blob?0.8:1));
    add(E("path",{d:chainD(J.tail,ws),fill:P.bodyD,...stk(P,0.85)}));
  }else add(E("path",{d:"M0 0",fill:"none",stroke:"none"}));

  /* ---- far ear ---- */
  const earSlots=[];
  for(const i of[0]){
    earSlots.push(makeEar(J.ear[i],r,s,P,1));
  }
  add(earSlots[0]);

  /* ---- far leg / far arm ---- */
  const legW=[r.legW*1.08,r.legW*0.86,r.legW*0.7], armWw=[r.armW,r.armW*0.82,r.armW*0.72];
  add(E("path",{d:chainD([J.hipL,J.kneeL,J.ankL],legW),fill:P.limbFarD,...stk(P,0.85)}));
  add(E("path",{d:footD(r.footL*0.92,r.footH*0.92),fill:P.limbFar,...stk(P,0.8),transform:`translate(${q(J.ankL.x)} ${q(J.ankL.y)}) rotate(${q(J.rotL*0.8)})`}));
  add(E("path",{d:chainD([J.shL,J.elbowL,J.wristL],armWw),fill:P.limbFarD,...stk(P,0.8)}));
  add(E("circle",{cx:q(J.wristL.x),cy:q(J.wristL.y),r:q(r.armW*0.85),fill:P.limbFar,...stk(P,0.75)}));

  /* ---- torso ---- */
  const tw=blob?0:r.torsoW;
  const bellyW=blob?J.bodyRX*0.62:r.torsoW*(1+s.belly*0.5)*Math.sqrt(1/Math.max(0.6,sq));
  if(blob){
    add(E("ellipse",{cx:q(J.center.x+3),cy:q(J.center.y+5),rx:q(J.bodyRX),ry:q(J.bodyRY),fill:P.paperShadow,stroke:"none",opacity:s.style==="papercut"?1:0}));
    add(E("ellipse",{cx:q(J.center.x),cy:q(J.center.y),rx:q(J.bodyRX),ry:q(J.bodyRY),fill:P.body,stroke:"none"}));
    add(E("path",{d:"M0 0",fill:"none",stroke:"none"}));
    add(E("ellipse",{cx:q(J.center.x),cy:q(J.center.y),rx:q(J.bodyRX),ry:q(J.bodyRY),fill:"none",...stk(P,1)}));
    /* papercut inner cut */
    add(E("ellipse",{cx:q(J.center.x-J.bodyRX*0.16),cy:q(J.center.y+J.bodyRY*0.22),rx:q(J.bodyRX*0.62),ry:q(J.bodyRY*0.5),fill:P.belly,opacity:s.style==="papercut"?0.55:0,stroke:"none"}));
  }else{
    /* papercut: dark offset copy */
    add(E("path",{d:chainD([{x:J.hips.x+3,y:J.hips.y+5},{x:J.spine.x+3,y:J.spine.y+5},{x:J.chest.x+3,y:J.chest.y+5}],[tw,tw*1.04,r.chestW*1.02]),fill:P.paperShadow,stroke:"none",opacity:s.style==="papercut"?1:0}));
    add(E("path",{d:chainD([J.hips,J.spine,J.chest],[tw,tw*(1+s.belly*0.55),r.chestW]),fill:P.body,...stk(P,1)}));
    add(E("ellipse",{cx:q(lerp(J.hips.x,J.spine.x,0.55)),cy:q(lerp(J.hips.y,J.spine.y,0.55)+r.torsoW*0.35),rx:q(bellyW*0.78),ry:q(r.torsoW*(0.85+s.belly*0.5)),fill:P.belly,opacity:s.belly>0.02?(blob?1:0.95):0,stroke:"none",transform:`rotate(${q(vAngDeg(J.spine.x-J.hips.x,J.spine.y-J.hips.y))} ${q(lerp(J.hips.x,J.spine.x,0.55))} ${q(lerp(J.hips.y,J.spine.y,0.55))})`}));
  }
  /* ink hatch */
  if(!blob){
    const hx=lerp(J.hips.x,J.spine.x,0.5),hy=lerp(J.hips.y,J.spine.y,0.5);
    add(E("path",{d:`M ${q(hx-6)} ${q(hy-8)} L ${q(hx+6)} ${q(hy+2)} M ${q(hx-8)} ${q(hy-2)} L ${q(hx+2)} ${q(hy+8)} M ${q(hx-2)} ${q(hy-10)} L ${q(hx+8)} ${q(hy)}`,stroke:P.lineC,"stroke-width":1.2,opacity:s.style==="ink"?0.3:0,"stroke-linecap":"round"}));
  }else add(E("path",{d:"M0 0",stroke:"none"}));

  /* pattern spots + stripes (seeded, fixed slots) */
  const pCount=mini?0:16, stCount=mini?0:5;
  let frame={cx:blob?J.center.x:(J.spine.x+J.chest.x)/2, cy:blob?J.center.y:(J.spine.y+J.chest.y)/2,
    ang:blob?0:vAngDeg(J.chest.x-J.hips.x,J.chest.y-J.hips.y),
    rx:(blob?J.bodyRX:r.torsoW)*0.85, ry:(blob?J.bodyRY:(r.spineLen+r.chestLen)*0.5)};
  const patFlip=mulberry32(((s.seed||0)>>>0)^0xA53F1)();
  const patType=patFlip<0.5?0:1;
  const patRng=mulberry32(((s.seed||0)>>>0)^0x77AA11);
  const dens=s.pattern;
  for(let i=0;i<pCount;i++){
    const px=(patRng()*2-1)*frame.rx*0.85, py=(patRng()*2-1)*frame.ry*0.9, pr=2+patRng()*3.4;
    const use=patType===0 && i/16<dens;
    add(E("ellipse",{cx:q(px),cy:q(py),rx:q(pr*r.S),ry:q(pr*r.S*0.86),fill:P.spot,opacity:(mini||!use)?0:0.5,transform:`translate(${q(frame.cx)} ${q(frame.cy)}) rotate(${q(frame.ang)})`}));
  }
  for(let i=0;i<stCount;i++){
    const sy0=-frame.ry+ (i+0.5)*(frame.ry*2/stCount);
    const use=patType===1 && i/5<dens;
    add(E("path",{d:`M ${q(-frame.rx*0.72)} ${q(sy0)} Q 0 ${q(sy0+5)} ${q(frame.rx*0.72)} ${q(sy0)}`,stroke:P.spot,"stroke-width":q((2.4+i%2)*r.S),fill:"none",opacity:(mini||!use)?0:0.45,"stroke-linecap":"round",transform:`translate(${q(frame.cx)} ${q(frame.cy)}) rotate(${q(frame.ang)})`}));
  }
  /* flat-style sheen on chest + head */
  add(E("ellipse",{cx:q(lerp(J.spine.x,J.chest.x,0.5)-2),cy:q(lerp(J.spine.y,J.chest.y,0.5)-r.torsoW*0.3),rx:q(r.torsoW*0.5),ry:q(r.torsoW*0.28),fill:"#fff",opacity:(s.style==="flat"&&!blob)?0.14:0,stroke:"none"}));

  /* ---- neck ---- */
  if(blob){ add(E("path",{d:"M0 0",fill:"none",stroke:"none"})); }
  else add(E("path",{d:capD(J.chest,J.neck,Math.max(4,r.chestW*0.42),Math.max(3.4,r.headR*0.34)),fill:P.bodyD,...stk(P,0.9)}));

  /* ---- head ---- */
  const ha=J.head.a||0, hr=r.headR*(blob?0.001:1);
  add(E("ellipse",{cx:q(J.head.x+3),cy:q(J.head.y+4),rx:q(hr*(r.type==="beast"?1.12:1)),ry:q(hr*(r.type==="beast"?0.88:1)),fill:P.paperShadow,stroke:"none",opacity:(s.style==="papercut"&&!blob)?1:0,transform:`rotate(${q(ha)} ${q(J.head.x)} ${q(J.head.y)})`}));
  if(blob){
    add(E("circle",{cx:0,cy:0,r:0,fill:"none",stroke:"none",opacity:0}));
  }else{
    add(E("ellipse",{cx:q(J.head.x),cy:q(J.head.y),rx:q(hr*(r.type==="beast"?1.12:1)),ry:q(hr*(r.type==="beast"?0.86:1)),fill:P.body,...stk(P,1),transform:`rotate(${q(ha)} ${q(J.head.x)} ${q(J.head.y)})`}));
  }
  /* snout + nose: placed in head-local units so they never collide with the eyes */
  const hcr=Math.cos(ha*D2R),hsr=Math.sin(ha*D2R);
  const hp=(lx,ly)=>({x:J.head.x+lx*hcr-ly*hsr,y:J.head.y+lx*hsr+ly*hcr});
  if(blob){ add(E("ellipse",{cx:q(J.head.x),cy:q(J.head.y),rx:q(0.5),ry:q(0.5),fill:"none",stroke:"none",opacity:0})); }
  else if(r.type==="beast"){
    const sp2=hp(hr*0.82,hr*0.14);
    add(E("ellipse",{cx:q(sp2.x),cy:q(sp2.y),rx:q(hr*(0.5+0.45*s.snout)),ry:q(hr*0.4),fill:P.belly,...stk(P,0.9),transform:`rotate(${q(ha)} ${q(sp2.x)} ${q(sp2.y)})`}));
  }else{
    const sp2=hp(9.5*u,11.5*u);
    const srx=u*(4.5+8.5*s.snout);
    add(E("ellipse",{cx:q(sp2.x),cy:q(sp2.y),rx:q(srx),ry:q(4.6*u),fill:P.belly,...stk(P,0.85),opacity:s.snout>0.03?1:0,transform:`rotate(${q(ha)} ${q(sp2.x)} ${q(sp2.y)})`}));
  }
  /* nose */
  {
    const np=r.type==="blob"?hp(2*u,8.5*u):(r.type==="beast"?hp(hr*(0.82+0.5+0.45*s.snout)*0.86,-hr*0.05):hp(9.5*u+(4.5+8.5*s.snout)*0.62,10.6*u));
    const nr=r.type==="blob"?[2*u,1.5*u]:(r.type==="beast"?[hr*0.15,hr*0.11]:[2.4*u,1.9*u]);
    add(E("ellipse",{cx:q(np.x),cy:q(np.y),rx:q(nr[0]),ry:q(nr[1]),fill:P.nose,stroke:"none"}));
  }
  /* horns (fixed 2 slots) */
  for(const i of[0,1]){
    const side=i?1:-1;
    const show=s.earVariant==="horn";
    const hx2=side*hr*0.42, hy2=-hr*0.78;
    const cr=Math.cos(ha*D2R),sr=Math.sin(ha*D2R);
    const x=J.head.x+hx2*cr-hy2*sr, y=J.head.y+hx2*sr+hy2*cr;
    add(E("path",{d:`M 0 0 Q ${q(side*hr*0.18)} ${q(-hr*0.5)} ${q(-side*hr*0.02)} ${q(-hr*0.86)} L ${q(-side*hr*0.14)} ${q(-hr*0.78)} Q ${q(side*hr*0.02)} ${q(-hr*0.42)} ${q(-side*hr*0.2)} ${q(0)} Z`,
      fill:HSL3(P,10,18,60),...stk(P,0.8),opacity:show?1:0,transform:`translate(${q(x)} ${q(y)}) rotate(${q(ha+side*14)})`}));
  }
  /* tufts */
  if(!mini){
    const tCount=1+Math.floor(mulberry32(((s.seed||0)>>>0)^0x9911)()*3);
    const tRng=mulberry32(((s.seed||0)>>>0)^0x1234);
    for(let i=0;i<3;i++){
      const show=i<tCount&&s.archetype!=="blob";
      const tt=(i-tCount/2+0.5)/Math.max(1,tCount);
      const hx2=tt*hr*0.5, hy2=-hr*0.92;
      const cr=Math.cos(ha*D2R),sr=Math.sin(ha*D2R);
      add(E("path",{d:`M 0 0 q ${q(2+3*tRng())} ${q(-hr*0.34)} ${q(5+6*tRng())} ${q(-hr*0.5)} q ${q(-3)} ${q(hr*0.34)} ${q(-1)} ${q(hr*0.5)} z`,
        fill:P.tuft,...stk(P,0.6),opacity:show?1:0,transform:`translate(${q(J.head.x+hx2*cr-hy2*sr)} ${q(J.head.y+hx2*sr+hy2*cr)}) rotate(${q(ha+(tRng()*2-1)*22)})`}));
    }
  }

  /* ---- near legs & arms on top of torso ---- */
  add(E("path",{d:chainD([J.hipR,J.kneeR,J.ankR],legW),fill:P.bodyD,...stk(P,1)}));
  add(E("path",{d:footD(r.footL,r.footH),fill:P.body,...stk(P,0.9),transform:`translate(${q(J.ankR.x)} ${q(J.ankR.y)}) rotate(${q(J.rotR*0.8)})`}));
  add(E("path",{d:chainD([J.shR,J.elbowR,J.wristR],armWw),fill:P.body,...stk(P,0.95)}));
  add(E("circle",{cx:q(J.wristR.x),cy:q(J.wristR.y),r:q(r.armW*0.9),fill:P.body,...stk(P,0.85)}));

  /* ---- near ear on top ---- */
  add(makeEar(J.ear[1],r,s,P,0));

  /* ---- face ---- */
  add(makeFace(J,u,r,s,P,F,mini,rng));

  /* ---- bone overlay ---- */
  if(o.bones)add(makeBones(J,mini));
  return {nodes:N,J,A,F,clip};
}
function HSL3(P,hOff,sa,l){return P.HSL(P.h+hOff,sa,l);}
/* ---------- ear builder ---------- */
function makeEar(ear,r,s,P,near){
  const er=Math.max(2.5,r.earR*Math.sqrt(r.S)*(r.type==="blob"?0.7:1));
  const fill=near?P.body:P.limbFar;
  const inner=P.HSL(P.h+344,60,74);
  const rot=ear.a+(s.earVariant==="lop"?(near?6:10):0);
  let outer,innerN;
  if(s.earVariant==="point"){
    const d=`M ${q(-er*0.2)} ${q(er*0.85)} Q ${q(-er*1.02)} ${q(-er*0.1)} ${q(-er*0.12)} ${q(-er*1.62)} Q ${q(er*0.72)} ${q(-er*0.5)} ${q(er*0.78)} ${q(er*0.6)} Z`;
    outer=E("path",{d,fill,...stk(P,0.9)});
    innerN=E("path",{d:`M ${q(-er*0.1)} ${q(er*0.5)} Q ${q(-er*0.6)} ${q(-er*0.05)} ${q(-er*0.05)} ${q(-er*0.95)} Q ${q(er*0.4)} ${q(-er*0.3)} ${q(er*0.44)} ${q(er*0.36)} Z`,fill:inner,stroke:"none",opacity:s.ear>0.05?0.95:0});
  }else if(s.earVariant==="lop"){
    outer=E("ellipse",{cx:q(er*0.18),cy:q(er*0.72),rx:q(er*0.6),ry:q(er*1.05),fill,...stk(P,0.9),transform:`rotate(26 ${q(er*0.18)} ${q(er*0.72)})`});
    innerN=E("ellipse",{cx:q(er*0.22),cy:q(er*0.75),rx:q(er*0.3),ry:q(er*0.62),fill:inner,stroke:"none",opacity:s.ear>0.05?0.85:0,transform:`rotate(26 ${q(er*0.22)} ${q(er*0.75)})`});
  }else if(s.earVariant==="horn"){
    outer=E("ellipse",{cx:q(-er*0.1),cy:q(-er*0.35),rx:q(er*0.5),ry:q(er*0.62),fill,...stk(P,0.9)});
    innerN=E("ellipse",{cx:0,cy:0,rx:0,ry:0,fill:inner,stroke:"none",opacity:0});
  }else{
    outer=E("ellipse",{cx:0,cy:0,rx:q(er),ry:q(er*0.94),fill,...stk(P,0.9)});
    innerN=E("ellipse",{cx:0,cy:q(er*0.08),rx:q(er*0.52),ry:q(er*0.5),fill:inner,stroke:"none",opacity:s.ear>0.05?0.95:0});
  }
  return E("g",{transform:`translate(${q(ear.x)} ${q(ear.y)}) rotate(${q(rot)})`},[outer,innerN]);
}

/* ---------- face builder (head-local) ---------- */
function makeFace(J,u,r,s,P,F,mini,rng){
  const blob=r.type==="blob";
  const kids=[];
  const ex=7.2*s.eyeSpace*u;
  const ey=-3*u;
  const rx=5.4*s.eye*u, ry=6.2*s.eye*u*(F.lidU<0?1+0.30*(-F.lidU):1);
  const close=clamp(F.lidU,0,1);
  const skin=P.body, inkW=Math.max(1,u*1.1);
  /* brows */
  for(const i of[0,1]){
    const side=i?1:-1;
    let rot=-F.brow*15;
    if(F.browStyle==="angry")rot+=13;
    if(F.browStyle==="sad")rot-=9;
    const bx=side*ex, by=ey-ry-5.2*u-Math.max(0,F.brow)*2.2*u-(F.browStyle==="angry"?1.5*u:0);
    kids.push(E("path",{d:`M ${q(-4.6*u)} 0 Q 0 ${q(-1.4*u)} ${q(4.6*u)} ${q(-0.2*u)}`,
      fill:"none",stroke:P.lineC,"stroke-width":fmt(clamp(2.4*u,1.4,4.2)),"stroke-linecap":"round",
      opacity:(u*P.ow<0.2&&s.style==="papercut")?0.7:1,
      transform:`translate(${q(bx)} ${q(by)}) rotate(${q(side? -rot: rot)})`}));
  }
  /* eyes: far (L) then near (R) */
  const perEye=mini?4:7;
  for(const i of[0,1]){
    const side=i?1:-1;
    const irisR=3.1*s.eye*u, pr=clamp(1.8*s.pupil*u*F.pupilMul*(s.eye*0.7+0.3),0.6,irisR*0.92);
    const g=[];
    g.push(E("ellipse",{cx:0,cy:0,rx:q(rx),ry:q(ry),fill:P.sclera,...(mini?{stroke:P.lineC,"stroke-width":q(inkW)}:stk(P,0.55)),opacity:close>=0.93?0:1}));
    g.push(E("circle",{cx:q(0.7*u),cy:q(F.irisDy*u*0.7),r:q(irisR),fill:P.iris,stroke:"none",opacity:close>=0.93?0:1}));
    if(!mini)g.push(E("circle",{cx:q(0.7*u),cy:q(F.irisDy*u*0.7),r:q(pr),fill:P.pupil,stroke:"none",opacity:close>=0.93?0:1}));
    if(!mini)g.push(E("circle",{cx:q(0.7*u-pr*0.42),cy:q(F.irisDy*u*0.7-pr*0.5),r:q(Math.max(0.8,pr*0.42)),fill:"#fff",stroke:"none",opacity:close>=0.93?0:0.95}));
    if(!mini)g.push(E("path",{d:`M ${q(-rx-1.6*u)} ${q(-ry-4.5*u)} L ${q(rx+1.6*u)} ${q(-ry-4.5*u)} L ${q(rx+1.6*u)} ${q(lerp(-ry,ry,close))} Q 0 ${q(lerp(-ry,ry,close)+2.6*u)} ${q(-rx-1.6*u)} ${q(lerp(-ry,ry,close))} Z`,
      fill:skin,stroke:"none",opacity:(close>0.03&&close<0.93)?1:0}));
    if(!mini)g.push(E("path",{d:`M ${q(-rx-1.4*u)} ${q(ry+4*u)} L ${q(rx+1.4*u)} ${q(ry+4*u)} L ${q(rx+1.4*u)} ${q(lerp(ry,-ry,F.lidL))} Q 0 ${q(lerp(ry,-ry,F.lidL)-2.2*u)} ${q(-rx-1.4*u)} ${q(lerp(ry,-ry,F.lidL))} Z`,
      fill:skin,stroke:"none",opacity:(F.lidL>0.03&&close<0.93)?1:0}));
    g.push(E("path",{d:`M ${q(-rx*0.9)} ${q(0.6*u)} Q 0 ${q(2.6*u)} ${q(rx*0.9)} ${q(0.6*u)}`,fill:"none",
      stroke:P.lineC,"stroke-width":q(clamp(2.2*u,1.2,4)),"stroke-linecap":"round",opacity:close>=0.93?1:0}));
    kids.push(E("g",{transform:`translate(${q(side*ex)} ${q(ey)})`},g));
  }
  /* mouth */
  const my=9.2*u, mw=5.8*u, c=F.curve;
  kids.push(E("path",{d:`M ${q(-mw)} ${q(my)} Q 0 ${q(my+c*3.6*u)} ${q(mw)} ${q(my)}`,fill:"none",
    stroke:P.lineC,"stroke-width":q(clamp(2.3*u,1.3,4.4)),"stroke-linecap":"round",
    opacity:F.open>0.13?0:1}));
  kids.push(E("path",{d:`M ${q(-mw)} ${q(my)} Q 0 ${q(my+c*3.6*u-(F.open>0.45?F.open*1.8*u:0))} ${q(mw)} ${q(my)} Q 0 ${q(my+c*3.6*u+2*u+F.open*9.5*u)} ${q(-mw)} ${q(my)} Z`,
    fill:P.mouthIn,...(mini?{stroke:P.lineC,"stroke-width":q(1.2*u)}:stk(P,0.7)),opacity:F.open>0.13?1:0}));
  if(!mini){
    kids.push(E("path",{d:`M ${q(-mw*0.78)} ${q(my+0.6*u+Math.min(0,c)*u)} L ${q(mw*0.78)} ${q(my+0.6*u+Math.min(0,c)*u)} L ${q(mw*0.55)} ${q(my+2.9*u)} L ${q(-mw*0.55)} ${q(my+2.9*u)} Z`,
      fill:P.teeth,stroke:"none",opacity:(F.teeth&&F.open>0.16)?1:0}));
    kids.push(E("ellipse",{cx:q(mw*0.1),cy:q(my+c*3.6*u+3.2*u+F.open*4.5*u),rx:q(mw*0.5),ry:q(1.9*u),fill:P.tongue,stroke:"none",
      opacity:((F.tongue||F.open>0.55)&&F.open>0.16)?1:0}));
  }
  /* blush */
  for(const i of[0,1]){
    kids.push(E("ellipse",{cx:q((i?1:-1)*(ex+1.6*u)),cy:q(my-4.6*u),rx:q(3.4*u),ry:q(2*u),fill:P.blushC,stroke:"none",
      opacity:fmt(F.blush*0.55)}));
  }
  /* freckles (seeded, fixed slots) */
  if(!mini){
    for(let i=0;i<6;i++){
      const fx=(rng()*2-1)*(ex+2.4*u), fy=my-6*u+rng()*4.5*u;

/* ---------- vnode patcher & DOM builder ---------- */
function setA(el,na,oa){
  for(const k in na){ if(oa[k]!==na[k]) el.setAttribute(k,String(na[k])); }
  for(const k in oa){ if(!(k in na)) el.removeAttribute(k); }
}
function buildNode(n){
  const el=document.createElementNS(NS,n.t);
  el.__a={};
  setA(el,n.a,el.__a);
  el.__a=n.a; el.__v=n;
  for(const c of n.c)el.appendChild(buildNode(c));
  return el;
}
function sameShape(a,b){
  if(a.t!==b.t||a.kc!==b.kc||a.c.length!==b.c.length)return false;
  for(let i=0;i<a.c.length;i++)if(!sameShape(a.c[i],b.c[i]))return false;
  return true;
}
function patch(parent,oldArr,newArr){
  const kids=parent.childNodes;
  let i=0;
  for(;i<newArr.length;i++){
    const ov=oldArr&&oldArr[i],el=kids[i],nv=newArr[i];
    if(ov&&el&&ov===el.__v&&sameShape(ov,nv)){
      setA(el,nv.a,ov.a);
      if(nv.c.length)patch(el,ov.c,nv.c);
      el.__v=nv;
    }else{
      while(parent.childNodes.length>i)parent.removeChild(parent.lastChild);
      for(let j=i;j<newArr.length;j++)parent.appendChild(buildNode(newArr[j]));
      return;
    }
  }
  while(parent.childNodes.length>i)parent.removeChild(parent.lastChild);
}

function escAttr(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function nodeToSVG(n){

  for(const k in n.a)a+=" "+k+'="'+escAttr(n.a[k])+'"';
  if(!n.c.length)return "<"+n.t+a+"/>";
  let inner="";

  return "<"+n.t+a+">"+inner+"</"+n.t+">";

/* ---------- stage view (zoom/pan) ---------- */
const view={vb:[0,0,512,512],tgt:null,tween:null};
function presetBox(m){
  if(m==="Full")return[0,0,512,512];
  if(m==="Body")return restCache.bodyBox;
  return restCache.faceBox;
}
function setPreset(m,animate=true){
  state.view=m;state.viewMode=m;
  const to=presetBox(m);
  if(animate)view.tween={from:view.vb.slice(),to:to,t0:performance.now(),dur:280};
  else view.vb=to.slice();
  $("vFull").setAttribute("aria-pressed",m==="Full");$("vBody").setAttribute("aria-pressed",m==="Body");$("vFace").setAttribute("aria-pressed",m==="Face");
  $("vFull").classList.toggle("on",m==="Full");$("vBody").classList.toggle("on",m==="Body");$("vFace").classList.toggle("on",m==="Face");
  saveSoon();
}
function stepView(now,dt){
  if(state.viewMode==="custom"){view.tgt=view.vb.slice();return;}
  const target=presetBox(state.view);
  view.tgt=target;
  if(view.tween){
    const k=clamp((now-view.tween.t0)/view.tween.dur,0,1),e=easeOut(k);
    view.vb=view.tween.from.map((v,i)=>lerp(v,view.tween.to[i],e));
    if(k>=1)view.tween=null;
  }else{
    const f=1-Math.exp(-dt*12);
    view.vb=view.vb.map((v,i)=>v+(target[i]-v)*f);
    if(target.every((v,i)=>Math.abs(v-view.vb[i])<0.02)){view.vb=target.slice();}
  }
}
function clientToVB(cx,cy){
  const rect=stageEl.getBoundingClientRect();
  const size=view.vb[2]||512;
  const scale=Math.min(rect.width,rect.height)/size;
  const ox=(rect.width-size*scale)/2, oy=(rect.height-size*scale)/2;
  return {x:view.vb[0]+(cx-rect.left-ox)/scale, y:view.vb[1]+(cy-rect.top-oy)/scale, scale};
}
function zoomAt(vx,vy,factor){
  const vb=view.vb.slice();
  let ns=clamp(vb[2]*factor,512/6,1024);
  const k=ns/vb[2];
  view.vb=[vx-(vx-vb[0])*k, vy-(vy-vb[1])*k, ns, ns];
  state.viewMode="custom";view.tween=null;
}
let stageEl=null;
const ptrs=new Map();
let pinch=null;
function bindStagePointer(){
  stageEl=$("stage");
  stageEl.addEventListener("wheel",e=>{
    e.preventDefault();
    const pt=clientToVB(e.clientX,e.clientY);
    zoomAt(pt.x,pt.y,Math.exp(e.deltaY*0.0015));
  },{passive:false});
  stageEl.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    stageEl.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){
      const [a,b]=[...ptrs.values()];
      pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb:view.vb.slice(),
        mid:clientToVB((a.x+b.x)/2,(a.y+b.y)/2)};
    }
  });
  stageEl.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId))return;
    const prev=ptrs.get(e.pointerId);
    if(ptrs.size===1){
      const rect=stageEl.getBoundingClientRect();
      const scale=Math.min(rect.width,rect.height)/(view.vb[2]||512);
      view.vb[0]-=(e.clientX-prev.x)/scale;view.vb[1]-=(e.clientY-prev.y)/scale;
      state.viewMode="custom";view.tween=null;
    }
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2&&pinch){
      const [a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch.d>8){
        const vb=pinch.vb.slice();
        let ns=clamp(vb[2]*(pinch.d/d),512/6,1024);
        const k=ns/vb[2];
        view.vb=[pinch.mid.x-(pinch.mid.x-vb[0])*k,pinch.mid.y-(pinch.mid.y-vb[1])*k,ns,ns];
        state.viewMode="custom";
      }
    }
  });
  const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;};
  stageEl.addEventListener("pointerup",up);
  stageEl.addEventListener("pointercancel",up);
}

function randomize(){
  const sd=newSeed();state.spec.seed=sd;
  const rnd=mulberry32(sd>>>0);
  for(const c of SLIDERS){
    const [a,b,st]=RANGES[c.k];
    let v=a+rnd()*(b-a);
    v=Math.round(v/st)*st;
    v=clamp(Math.round(v*100)/100,a,b);

  if(state.spec.outline<0.75&&state.spec.style!=="ink")state.spec.outline=1.5;
  const eA=["humanoid","beast","blob"],eB=["round","point","lop","horn"],eC=["flat","ink","papercut"];

});
function rasterize(svg,img,urlCache){
  return new Promise(res=>{
    const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    img.onload=()=>{res({ok:true,url});};
    img.onerror=()=>{res({ok:false,url});};
    img.src=url;
  });
}
async function bake(){
  if(baking)return;baking=true;
  const btn=$("bakeBtn");btn.disabled=true;
  const prog=$("bakeProg"),bar=$("bakeBar"),note=$("exNote");
  try{
    const N=state.ex.frames, rows=CLIPS.length;
    let chosen=state.ex.cell, cell=chosen;
    note.textContent="";
    const candidates=[chosen,128,64].filter((v,i,a)=>a.indexOf(v)===i);
    let found=false;
    for(const c of candidates){
      if(probeCanvas(c*N,rows*c)){cell=c;found=true;break;}
    }
    if(!found){note.textContent="Canvas unavailable on this device — cannot bake.";baking=false;btn.disabled=false;return;}
    if(cell!==chosen)note.textContent=`Cell size reduced ${chosen}px → ${cell}px to stay within this device's safe canvas limit.`;
    const Wpx=cell*N,Hpx=rows*cell,total=9*N+6*4;
    const atlas=document.createElement("canvas");atlas.width=Wpx;atlas.height=Hpx;
    const ctx=atlas.getContext("2d");
    const img=new Image();
    let done=0;
    prog.textContent=`Baking 0/${total}`;bar.style.width="0%";
    const frames=[],anims={};
    let row=0;
    for(const clip of CLIPS){
      const n=clip.expr?4:N;
      const vb=clip.expr?(()=>{const b=restCache.faceBox;return `${fmt(b[0])} ${fmt(b[1])} ${fmt(b[2])} ${fmt(b[3])}`;})():"0 0 512 512";
      const names=[];
      for(let i=0;i<n;i++){
        const t=n===1?0:i/n;
        const svg=serializeFrameSVG(state.spec,clip.id,t,cell,vb,state.ex.shadow);
        const hash=fnv1a(svg);
        const x=i*cell,y=row*cell;
        const r=await rasterize(svg,img);
        if(r.ok)ctx.drawImage(img,x,y,cell,cell);
        URL.revokeObjectURL(r.url);
        const fn=`${clip.id}_${String(i).padStart(2,"0")}`;
        names.push(fn);
        frames.push({
          filename:fn,
          frame:{x,y,w:cell,h:cell},
          rotated:false,trimmed:false,
          spriteSourceSize:{x:0,y:0,w:cell,h:cell},
          sourceSize:{w:cell,h:cell},
          pivot:clip.expr?{x:0.5,y:0.5}:{x:0.5,y:0.875},
          sourceHash:hash
        });
        done++;
        if(done%2===0||done===total){
          prog.textContent=`Baking ${done}/${total}`;
          bar.style.width=Math.round(done/total*100)+"%";
          await yieldUI();
        }
      }
      anims[clip.id]={fps:Math.round(n/clip.dur*10)/10,loop:!!clip.loop,frames:names};
      row++;
    }
    const seed=state.spec.seed;
    const json={
      frames,
      meta:{
        app:"Rigsmith",version:"1.0.0",
        image:`rigsmith-${seed}-atlas.png`,
        format:"RGBA8888",
        size:{w:Wpx,h:Hpx},scale:"1",
        seed,generatedAt:new Date().toISOString(),
        generator:GEN,spec:state.spec
      },
      animations:anims
    };
    const pngBlob=await new Promise(res=>atlas.toBlob(res,"image/png"));
    const jsonBlob=new Blob([JSON.stringify(json,null,1)],{type:"application/json"});
    for(const u of exportURLs)URL.revokeObjectURL(u);
    exportURLs=[];
    const pngURL=URL.createObjectURL(pngBlob),jsonURL=URL.createObjectURL(jsonBlob);
    exportURLs.push(pngURL,jsonURL);
    lastBake={pngURL,jsonURL,json,png:pngBlob,name:`rigsmith-${seed}-atlas.png`,jname:`rigsmith-${seed}-atlas.json`,cell,Wpx,Hpx,total};
    const prev=$("atlasPrev");
    prev.innerHTML="";
    const im=document.createElement("img");im.src=pngURL;im.alt="baked atlas";
    prev.appendChild(im);prev.style.display="flex";
    $("atlasInfo").textContent=`${Wpx}×${Hpx}px · ${total} frames · ${rows} clips · cell ${cell}px`;
    $("dlBtns").style.display="flex";
    prog.textContent=`Baked ${total}/${total} ✓`;
    bar.style.width="100%";
  }catch(err){
    $("bakeProg").textContent="Bake failed: "+(err&&err.message||err);
  }finally{
    baking=false;btn.disabled=false;
  }
}
function saveURL(url,name){
  const a=document.createElement("a");
  a.href=url;a.download=name;a.rel="noopener";
  if("download" in a){
    document.body.appendChild(a);a.click();a.remove();
    toast(`Saved ${name}. If your browser blocked it, tap "Open in tab" and hold to save.`);
  }else{
    window.open(url,"_blank");
    toast(`Opened ${name} in a new tab — long-press (or right-click) to save.`);
  }
}
function toast(msg){
  const d=document.createElement("div");d.className="toast";d.textContent=msg;
  $("toasts").appendChild(d);
  setTimeout(()=>d.remove(),5200);
}
function bindExportUI(){
  document.querySelectorAll("[data-cell]").forEach(b=>b.addEventListener("click",()=>{
    state.ex.cell=Number(b.dataset.cell);
    document.querySelectorAll("[data-cell]").forEach(x=>x.classList.toggle("on",x===b));
  }));
  const bf=$("bodyFrames");
  bf.addEventListener("input",()=>{state.ex.frames=Number(bf.value);$("bodyFramesV").textContent=bf.value;});
  $("exShadow").addEventListener("change",e=>state.ex.shadow=e.target.checked);
  $("bakeBtn").addEventListener("click",()=>bake());
  $("dlPng").addEventListener("click",()=>{if(lastBake)saveURL(lastBake.pngURL,lastBake.name);});
  $("dlJson").addEventListener("click",()=>{if(lastBake)saveURL(lastBake.jsonURL,lastBake.jname);});
}

/* ---------- keyboard ---------- */
function bindKeys(){
  document.addEventListener("keydown",e=>{
    const tag=(e.target.tagName||"").toUpperCase();
    const typing=tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA";
    if(e.key===" "&&!typing){e.preventDefault();$("playBtn").click();return;}
    if(typing)return;
    if(e.key==="1")setPreset("Full");
    else if(e.key==="2")setPreset("Body");
    else if(e.key==="3")setPreset("Face");
    else if(e.key==="["||e.key==="]"){
      const i=CLIPS.findIndex(c=>c.id===state.clip);
      const j=(i+(e.key==="]"?1:-1)+CLIPS.length)%CLIPS.length;
      selectClip(CLIPS[j].id);
    }
    else if(e.key==="b"||e.key==="B"){$("tBones").click();}
    else if(e.key==="e"||e.key==="E"){if(!typing)bake();}
  });
}

/* ---------- main loop ---------- */
let lastScene=null;
function frame(now){
  const dt=Math.min(0.05,(now-lastNow)/1000)||0.016;lastNow=now;
  frameNo++;gclock+=dt;
  fpsFrames++;fpsT+=dt;
  if(fpsT>0.5){
    const f=Math.round(fpsFrames/fpsT);
    $("fps").textContent="FPS "+f;
    fpsFrames=0;fpsT=0;
  }
  if(specDirty){restCache=computeRest();tilesDirty=true;specDirty=false;}
  const clip=clipById(state.clip);
  if(state.playing){
    state.time+=dt*state.speed;
    if(state.time>=clip.dur){
      if(clip.loop&&state.loop)state.time=state.time%clip.dur;
      else{state.time=clip.dur;state.playing=false;updatePlayBtn();}
    }
  }
  const sc=buildScene(state.spec,state.clip,state.time/dur0(clip),
    {mini:false,ground:state.ground,bones:state.bones,props:true,bg:true,idns:"stage"});
  if(lastScene){patch(stageContent,lastScene,sc.nodes);}else{patch(stageContent,[],sc.nodes);}
  lastScene=sc.nodes;
  stepView(now,dt);
  const vb=view.vb;
  stageEl.setAttribute("viewBox",`${fmt(vb[0])} ${fmt(vb[1])} ${fmt(vb[2])} ${fmt(vb[3])}`);
  if(tilesDirty){refreshTiles(true);}
  else if(!state.galleryPaused&&frameNo%galEvery===0)refreshTiles(false);
  if(!scrubbing){
    const p=Math.round(state.time/dur0(clip)*1000);
    $("scrub").value=p;$("pct").textContent=Math.round(p/10)+"%";
  }
  requestAnimationFrame(frame);
}
const dur0=c=>c.dur;

/* ---------- boot ---------- */
let stageContent=null;
function boot(){
  document.getElementById("signoff").innerHTML=
    `Rigsmith — built <b>${BUILT}</b> by <b>${GEN}</b> · single-file, offline, deterministic`;
  loadSaved();
  applyMQ();
  buildControls();syncControls();
  stageEl=$("stage");
  stageEl.innerHTML="";
  const defs=document.createElementNS(NS,"defs");
  defs.innerHTML=`<linearGradient id="stagesky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26304a"/><stop offset="1" stop-color="#12151d"/></linearGradient>`;
  stageEl.appendChild(defs);
  stageContent=document.createElementNS(NS,"g");
  stageEl.appendChild(stageContent);
  buildRail();
  bindStagePointer();bindTransport();bindExportUI();bindKeys();
  $("dice").addEventListener("click",()=>{state.spec.seed=newSeed();syncControls();markSpec();saveSoon();});
  $("seed").addEventListener("input",e=>{
    const v=Math.floor(Number(e.target.value));
    if(isFinite(v)&&e.target.value!==""){state.spec.seed=clamp(v,0,2147483646);markSpec();saveSoon();}
  });
  $("seed").addEventListener("change",e=>{if(e.target.value===""){e.target.value=state.spec.seed;}});
  document.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>applyPreset(b.dataset.preset)));
  $("randomize").addEventListener("click",randomize);
  $("reset").addEventListener("click",()=>{state.spec=normSpec(DEF);syncControls();markSpec();saveSoon();});
  $("resetAll").addEventListener("click",()=>resetAll(false));
  $("vFull").addEventListener("click",()=>setPreset("Full"));
  $("vBody").addEventListener("click",()=>setPreset("Body"));
  $("vFace").addEventListener("click",()=>setPreset("Face"));
  $("tBones").addEventListener("click",()=>{state.bones=!state.bones;$("tBones").setAttribute("aria-pressed",state.bones);});
  $("tGround").addEventListener("click",()=>{state.ground=!state.ground;$("tGround").setAttribute("aria-pressed",state.ground);});
  $("zIn").addEventListener("click",()=>{const c={x:view.vb[0]+view.vb[2]/2,y:view.vb[1]+view.vb[3]/2};zoomAt(c.x,c.y,1/1.25);});
  $("zOut").addEventListener("click",()=>{const c={x:view.vb[0]+view.vb[2]/2,y:view.vb[1]+view.vb[3]/2};zoomAt(c.x,c.y,1.25);});
  $("zReset").addEventListener("click",()=>setPreset(state.view));
  document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{
    document.body.setAttribute("data-tab",b.dataset.tab);
    document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
    if(b.dataset.tab==="clips")refreshTiles(true);
  }));
  restCache=computeRest();
  selectClip(state.clip);
  setPreset(state.view,false);
  requestAnimationFrame(frame);
}
/* test/debug hooks (harmless in production) */
window.__rs={
  state,clipAct,makeRig,solveJoints,buildScene,faceState,serializeFrameSVG,fnv1a,CLIPS,
  lastBake:()=>lastBake,
  setSpec(o){Object.assign(state.spec,o);markSpec();},
  plantCheck(id,N){
    const out=[];const s=state.spec,r=makeRig(s),clip=clipById(id||"walk");
    for(let i=0;i<(N||8);i++){
      const t=i/(N||8);
      const A=clipAct(clip.id,t,s,r);
      const J=solveJoints(s,r,A,{tail:0,ear:0});
      const sl=J.rotL!==undefined?soleY(J.rotL,r.footL,r.footH):0;
      const sr=J.rotR!==undefined?soleY(J.rotR,r.footL,r.footH):0;
      out.push({t:+t.toFixed(3),soleL:+(J.ankL.y+sl).toFixed(2),soleR:+(J.ankR.y+sr).toFixed(2),
        stanceL:A.gait?A.gait.A.inStance:null,stanceR:A.gait?A.gait.B.inStance:null});
    }
    return out;
  },
  bake
};
window.addEventListener("DOMContentLoaded",boot);
</script>
